# Security headers shared by the SPA and API locations.
# NOTE: HSTS is only honoured by browsers over HTTPS; TLS is normally
# terminated by an upstream load balancer / reverse proxy in production.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy for the React SPA. Google Maps is only used for the
# embedded contact-page map; remote images come from the demo Unsplash URLs.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://via.placeholder.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; upgrade-insecure-requests" always;
