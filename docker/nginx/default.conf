server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;
    client_body_timeout 60s;
    keepalive_timeout 65s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---------------------------------------------------------------------
    # API: forward to php-fpm. Laravel resolves routes from REQUEST_URI, so a
    # single front controller is enough for every /api and /sanctum request.
    # ---------------------------------------------------------------------
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $https;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
        fastcgi_buffering off;

        include snippets/security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    location = /sanctum/csrf-cookie {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;

        include snippets/security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    # Laravel's built-in health endpoint (bootstrap/app.php health: '/up').
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Uploaded public assets (product/store photos, avatars) live on the
    # shared storage volume. They are served statically by nginx.
    # ---------------------------------------------------------------------
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Never serve dotfiles (e.g. .env), backups or source maps.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:map|log|sql|env)$ {
        deny all;
    }

    location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # SPA fallback: every unknown path renders index.html and React Router
    # takes over (e.g. /products/wireless-earbuds, /admin/sales).
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
