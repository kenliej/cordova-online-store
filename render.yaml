# Render Blueprint for the Online Mall Laravel API.
# Infrastructure: Render Docker web service + Neon Postgres/Object Storage/etc.
# Frontend stays on Vercel (static) and talks to this API with Bearer tokens.
#
# Create via Render Dashboard -> New -> Blueprint, or `render blueprints validate`.
services:
  - type: web
    name: gaisano-onlinemall-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./production/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # --- Laravel ---------------------------------------------------------
      - key: APP_NAME
        value: "Online Mall Cordova"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_FORCE_HTTPS
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: TRUSTED_HOSTS
        value: "*.onrender.com,localhost"
      - key: TRUSTED_PROXIES
        value: "*"

      # --- Neon Postgres ---------------------------------------------------
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      # Pooled connection for requests; direct connection is used automatically
      # by production/start.sh for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # DB_HOST / DB_DATABASE / DB_USERNAME / DB_PASSWORD are only needed if
      # you use separate credentials instead of DATABASE_URL. The app reads
      # DATABASE_URL directly, so they are intentionally not prompted here.

      # --- Sessions / cache / queue ---------------------------------------
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: RUN_MIGRATIONS
        value: "true"

      # --- Auth / CORS (Vercel SPA uses Bearer tokens) ----------------------
      - key: SANCTUM_STATEFUL_DOMAINS
        value: ""
      - key: SANCTUM_EXPIRATION
        value: "10080"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_SUPPORTS_CREDENTIALS
        value: "false"

      # --- Neon Object Storage (S3-compatible bucket "assets") -------------
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: NEON_OBJECT_STORAGE_BUCKET
        value: assets

      # --- Neon AI Gateway --------------------------------------------------
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false

      # --- Neon Realtime (configured; app currently polls) ----------------
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false

      # --- Email / forgot-password disabled in production ------------------
      # Mailpit is local-Docker only. No SMTP credentials are configured on
      # Render; the API rejects forgot/reset-password (404) and the SPA hides
      # the link. Set PASSWORD_RESET_ENABLED=true + SMTP vars to re-enable.
      - key: PASSWORD_RESET_ENABLED
        value: "false"
      - key: MAIL_MAILER
        value: log

    # Free Render services have an ephemeral filesystem. Attach a paid disk if
    # uploads must persist locally, or migrate media to Neon Object Storage.
    # disk:
    #   name: media
    #   mountPath: /var/www/html/storage/app
    #   sizeGB: 1
