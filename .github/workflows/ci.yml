name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel test + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mbstring, bcmath, fileinfo, curl, dom, xml, tokenizer, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify dependency advisories
        run: composer audit

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Run test suite
        run: php artisan test --parallel

  frontend:
    name: Frontend build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # The upstream lockfile has a TypeScript peer-range conflict; see README.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare docker env
        run: |
          cp .env.example .env
          php -r "file_put_contents('.env', str_replace('APP_KEY=', 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, file_get_contents('.env')));"
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci-test-password/' .env
          sed -i 's/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci-root-test-password/' .env

      - name: Build images
        run: docker compose build --pull

      - name: Start stack and smoke-test health
        run: |
          docker compose up -d db app web
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=200
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
