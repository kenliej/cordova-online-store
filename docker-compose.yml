# ---------------------------------------------------------------------------
# Online Mall Cordova — full production-like stack
#
#   web      nginx: serves the built React SPA + proxies /api to php-fpm
#   app      PHP 8.2 FPM (Laravel 12 API, Sanctum SPA auth)
#   db       PostgreSQL 16 (data on a named volume, not published to the host)
#   queue    Laravel queue worker (mail, future jobs)
#   scheduler Laravel scheduler (e.g. auto-expiring ready orders)
#   mailpit  local SMTP sink + web UI for password-reset e-mails
#
# Usage:
#   cp .env.example .env      # then set APP_KEY + DB_PASSWORD
#   docker compose up -d --build
#   docker compose exec app php artisan app:seed-demo --force
#
# On Windows, `npm run docker:up` does all of the above (checks Docker, creates
# .env, generates APP_KEY/DB_PASSWORD, waits for health and seeds demo data).
# Full guide: docs/DOCKER-QUICKSTART.md
#
# Requires: Docker Engine 24+ / Docker Desktop with Compose v2.
# ---------------------------------------------------------------------------
name: onlinemall

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: onlinemall-api:local

x-app-environment: &app-environment
  APP_NAME: "Online Mall Cordova"
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?APP_KEY is required - generate it as documented in README.md}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
  APP_FORCE_HTTPS: ${APP_FORCE_HTTPS:-false}
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-online_mall}
  DB_USERNAME: ${DB_USERNAME:-onlinemall}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: lax
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@gaisano-cordova.com}
  MAIL_FROM_NAME: "Online Mall Cordova"
  TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12"
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"

services:
  db:
    image: postgres:16-alpine
    container_name: onlinemall-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-online_mall}
      POSTGRES_USER: ${DB_USERNAME:-onlinemall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${APP_TIMEZONE:-Asia/Manila}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app-build
    container_name: onlinemall-app
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_ROLE: web
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: onlinemall-web:local
    container_name: onlinemall-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

  queue:
    <<: *app-build
    container_name: onlinemall-queue
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_ROLE: worker
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=90", "--max-time=3600"]
    # The image healthcheck probes php-fpm (port 9000), which this worker does
    # not run; disable it so the container does not report "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  scheduler:
    <<: *app-build
    container_name: onlinemall-scheduler
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_ROLE: worker
    command: ["php", "artisan", "schedule:work", "--verbose"]
    # Same as the queue worker: no php-fpm inside this container.
    healthcheck:
      disable: true
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:latest
    container_name: onlinemall-mailpit
    restart: unless-stopped
    ports:
      # SMTP sink UI is only reachable from the Docker host itself.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

  # Optional database web UI (Adminer): npm run docker:db-ui
  # http://127.0.0.1:8081  server: db  user: onlinemall  DB: online_mall
  # Password: DB_PASSWORD from .env. Bound to localhost only.
  adminer:
    image: adminer:4
    container_name: onlinemall-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: nette
    depends_on:
      db:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

networks:
  onlinemall:
    driver: bridge

volumes:
  db_data:
  app_storage:
