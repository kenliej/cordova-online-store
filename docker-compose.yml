# ---------------------------------------------------------------------------
# Online Mall Cordova — full production-like stack
#
#   web      nginx: serves the built React SPA + proxies /api to php-fpm
#   app      PHP 8.2 FPM (Laravel 12 API, Sanctum SPA auth)
#   db       MySQL 8.4 (data on a named volume, not published to the host)
#   queue    Laravel queue worker (mail, future jobs)
#   scheduler Laravel scheduler (e.g. auto-expiring ready orders)
#   mailpit  local SMTP sink + web UI for password-reset e-mails
#
# Usage:
#   cp .env.example .env      # then set APP_KEY, DB_PASSWORD, DB_ROOT_PASSWORD
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed
#
# Requires: Docker Engine 24+ / Docker Desktop with Compose v2.
# ---------------------------------------------------------------------------
name: onlinemall

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: onlinemall-api:local

x-app-environment: &app-environment
  APP_NAME: "Online Mall Cordova"
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?APP_KEY is required - generate it as documented in README.md}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
  APP_FORCE_HTTPS: ${APP_FORCE_HTTPS:-false}
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-online_mall}
  DB_USERNAME: ${DB_USERNAME:-onlinemall}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: lax
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@onlinemall.test}
  MAIL_FROM_NAME: "Online Mall Cordova"
  TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12"
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"

services:
  db:
    image: mysql:8.4
    container_name: onlinemall-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-online_mall}
      MYSQL_USER: ${DB_USERNAME:-onlinemall}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: ${APP_TIMEZONE:-Asia/Manila}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app-build
    container_name: onlinemall-app
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_ROLE: web
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: onlinemall-web:local
    container_name: onlinemall-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

  queue:
    <<: *app-build
    container_name: onlinemall-queue
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_ROLE: worker
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=90", "--max-time=3600"]
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  scheduler:
    <<: *app-build
    container_name: onlinemall-scheduler
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_ROLE: worker
    command: ["php", "artisan", "schedule:work", "--verbose"]
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:latest
    container_name: onlinemall-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - onlinemall
    security_opt:
      - no-new-privileges:true

networks:
  onlinemall:
    driver: bridge

volumes:
  db_data:
  app_storage:
